# Managed by Tria, which rewrites this file: changes made here do not last.
# main deploys to production; every other branch gets its own Preview. What must run before
# each deploy, such as migrations, goes in package.json's "release" and "release:preview" scripts.
name: Deploy
on:
  push:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  # A production deploy, and the migrations before it, always run to the end.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CLOUDFLARE_ACCOUNT_ID: c57075277e9834ed6b6313451d18e7b3
# One job per target, so a branch's run never receives production's values.
jobs:
  production:
    name: Cloudflare Workers
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load the app's variables
        env:
          TRIA_ENV: ${{ secrets.TRIA_ENV_PRODUCTION }}
        run: |
          node <<'JS'
          const crypto = require('node:crypto')
          const variables = JSON.parse(process.env.TRIA_ENV || '{}')
          let lines = ''
          for (const [name, value] of Object.entries(variables)) {
            for (const line of value.split('\n')) if (line.trim()) console.log('::add-mask::' + line)
            const end = 'TRIA_' + crypto.randomUUID()
            lines += name + '<<' + end + '\n' + value + '\n' + end + '\n'
          }
          require('node:fs').appendFileSync(process.env.GITHUB_ENV, lines)
          JS
      - run: npm run build
      - run: npm run release --if-present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  preview:
    name: Cloudflare Workers
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load the app's variables
        env:
          TRIA_ENV: ${{ secrets.TRIA_ENV_PREVIEW }}
        run: |
          node <<'JS'
          const crypto = require('node:crypto')
          const variables = JSON.parse(process.env.TRIA_ENV || '{}')
          let lines = ''
          for (const [name, value] of Object.entries(variables)) {
            for (const line of value.split('\n')) if (line.trim()) console.log('::add-mask::' + line)
            const end = 'TRIA_' + crypto.randomUUID()
            lines += name + '<<' + end + '\n' + value + '\n' + end + '\n'
          }
          require('node:fs').appendFileSync(process.env.GITHUB_ENV, lines)
          JS
      - run: npm run build
      - name: Add Tria's inspector to this Preview
        env:
          # The wrapper module, with src/server/inspector.js from Tria inside it.
          TRIA_PREVIEW_ENTRY: 
        run: |
          node <<'JS'
          const fs = require('node:fs')
          const path = require('node:path')
          const skip = (why) => { console.log('::notice::This Preview has no inspector: ' + why); process.exit(0) }
          const redirect = '.wrangler/deploy/config.json'
          if (!fs.existsSync(redirect)) skip('the build wrote no Worker for wrangler to deploy')
          const configPath = path.resolve(path.dirname(redirect), JSON.parse(fs.readFileSync(redirect, 'utf8')).configPath)
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'))
          if (typeof config.main !== 'string' || !config.main.endsWith('.js')) skip('its Worker is not a built .js module')
          const dir = path.dirname(configPath)
          const entry = path.resolve(dir, config.main)
          const wrapper = path.join(path.dirname(entry), 'tria-preview.js')
          const source = Buffer.from(process.env.TRIA_PREVIEW_ENTRY, 'base64').toString('utf8')
          fs.writeFileSync(wrapper, source.replaceAll("'ENTRY'", JSON.stringify('./' + path.basename(entry))))
          let snapdom = null
          try {
            const { execFileSync } = require('node:child_process')
            const tmp = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP || require('node:os').tmpdir(), 'tria-'))
            const [packed] = JSON.parse(execFileSync('npm', ['pack', "@zumer/snapdom@3.3.0", '--json', '--ignore-scripts', '--pack-destination', tmp], { encoding: 'utf8' }))
            const tarball = path.join(tmp, packed.filename)
            const integrity = 'sha512-' + require('node:crypto').createHash('sha512').update(fs.readFileSync(tarball)).digest('base64')
            if (integrity !== "sha512-DR4HnXp5vlLDymmAE5z/QWzxtsc+wrpjo/QXvj5R377wKarwpCQO2LzUuQjWhJaMDNAyCjvxJB4EN8Zgs8Ri9w==") throw new Error('its tarball is not the one Tria pinned')
            execFileSync('tar', ['xzf', tarball, '-C', tmp, 'package/dist/snapdom.mjs'])
            snapdom = fs.readFileSync(path.join(tmp, 'package/dist/snapdom.mjs'), 'utf8')
          } catch (error) {
            console.log("::notice::Screenshots in this Preview use the browser's screen capture: snapdom was not added (" + error.message + ')')
          }
          fs.writeFileSync(path.join(path.dirname(entry), 'tria-snapdom.js'), 'export default ' + JSON.stringify(snapdom) + '\n')
          config.main = path.relative(dir, wrapper)
          fs.writeFileSync(configPath, JSON.stringify(config))
          console.log("Added Tria's inspector to this Preview")
          JS
      - run: npm run release:preview --if-present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler preview --name "$GITHUB_REF_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
